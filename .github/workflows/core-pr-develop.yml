name: Pull Request to Develop

on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:

  branch-check:
    runs-on: ${{ inputs.runs-on }} 
    steps:
      - run: |
          if [[ ${{ github.head_ref }} = feature*  ]] || [[ ${{ github.head_ref }} = hotfix* ]]
          then
            echo "${{ github.head_ref }} branch is allowed"
          else
            echo "${{ github.head_ref }} branch is not allowed"
            exit 1
          fi

  container-image-build-with-podman:
    needs: branch-check
    runs-on: ${{ inputs.runs-on }}

    # Run job in a container that has podman
    container:
      image: quay.io/podman/stable:latest

    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
      TAG: pr-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Debug vars
        shell: sh
        run: |
          echo "IMAGE=$IMAGE"
          echo "TAG=$TAG"
          podman --version || true

      - name: Build (rootless-friendly)
        shell: sh
        run: |
          podman build \
            --storage-driver=vfs \
            -f ./Containerfile \
            -t "${IMAGE}:${TAG}" \
            .


