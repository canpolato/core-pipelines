name: Promote to Staging

on:
  workflow_call:
    inputs:
      cr_number:
        description: "CR Number"
        required: true
        type: string
      release_branch_name:
        description: "Release branch to promote (e.g. release/release-name)"
        required: true
        type: string

jobs:
  branch-pr-cr-check:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - name: Branch Check
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_branch_name }}
        run: |
          REF="${RELEASE_REF#refs/heads/}"
          if [[ "$REF" == release/* ]]; then
            echo "Input branch '$REF' is allowed."
          else
            echo "::error::Input branch '$REF' is not allowed. Only release/* branches can be promoted to STG."
            exit 1
          fi
      - name: Validate CR number
        run: |
          if [ -z "${{ inputs.cr_number }}" ]; then
            echo "CR number is required."
            exit 1
          fi
          echo "CR=${{ inputs.cr_number }}"
        shell: bash
      - name: Resolve release branch HEAD SHA
        id: resolve
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_branch_name }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Strip a leading "refs/heads/" if the operator typed the full ref
          REF="${RELEASE_REF#refs/heads/}"
          SHA=$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "refs/heads/${REF}" | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::Branch '${REF}' not found on origin."
            exit 1
          fi
          TAG="release-${SHA}"
          if ! [[ "$TAG" =~ ^release-[0-9a-f]{7,40}$ ]]; then
            echo "::error::Resolved tag '${TAG}' is not a valid release-<sha>."
            exit 1
          fi
          echo "release_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${REF} -> ${TAG}"
      - name: CR Information
        run: |
          echo "Staging Promotion Request"
          echo "CR Number: ${{ inputs.cr_number }}"
          echo "Release Branch Name: ${{ inputs.release_branch_name }}"
          echo "Release Branch HEAD SHA: ${{ steps.resolve.outputs.release_sha }}"
          echo "Image Tag: ${{ steps.resolve.outputs.release_tag }}"
        shell: bash

  approve_security:
    runs-on: ubuntu-latest
    needs: branch-pr-cr-check
    environment: stg-approve-security
    steps:
      - run: echo "Security approval granted."

  approve_po:
    runs-on: ubuntu-latest
    needs: approve_security
    environment: stg-approve-po
    steps:
      - run: echo "Release/Change approval granted."

  stg-deployment:
    runs-on: ubuntu-latest
    needs: [approve_security, approve_po, branch-pr-cr-check]
    environment: stg
    steps:
      - name: Checkout config repo
        uses: actions/checkout@master
        with:
          repository: ${{ github.repository }}-config
          ref: staging
          path: './${{ github.event.repository.name }}-config'

      - name: Update values-stg.yaml
        uses: fjogeleit/yaml-update-action@main
        with:
          repository: ${{ github.repository }}-config
          workDir: '${{ github.event.repository.name }}-config'
          valueFile: 'helm-charts/${{ github.event.repository.name }}/values-stg.yaml'
          propertyPath: 'image.tag'
          value: ${{ needs.branch-pr-cr-check.outputs.release_tag }}
          branch: staging
          masterBranchName: staging
          targetBranch: staging
          token: ${{ secrets.CONFIG_PAT }}
          message: CD Change by Pipeline - CR=${{ inputs.cr_number }}
          commitChange: true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag image as STG
        run: |
          docker pull canpolatoral/${{ github.event.repository.name }}:${{ needs.branch-pr-cr-check.outputs.release_tag }}
          docker tag  canpolatoral/${{ github.event.repository.name }}:${{ needs.branch-pr-cr-check.outputs.release_tag }} \
                     canpolatoral/${{ github.event.repository.name }}:stg-latest
          docker push canpolatoral/${{ github.event.repository.name }}:stg-latest
