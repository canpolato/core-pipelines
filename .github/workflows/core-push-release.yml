name: Push to Release

on:
  workflow_call:
    inputs:
      cr_number:
        description: CR Number is required for staging deployment
        required: true
        type: string
  
jobs:

  docker-image-build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # - name: Show GitHub context
      #   env:
      #     GITHUB_CONTEXT: ${{ toJson(github) }}
      #   run: echo "$GITHUB_CONTEXT"
      # - name: "Latest Commit Id"
      #   run: echo ${{ github.sha }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: canpolatoral/${{ github.event.repository.name }}:release-${{ github.run_number }}, canpolatoral/${{ github.event.repository.name }}:release-${{ github.sha }}, canpolatoral/${{ github.event.repository.name }}:release-latest

  sit-deployment:
    runs-on: ubuntu-latest
    needs: docker-image-build
    environment: sit
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          repository: ${{ github.repository }}-config
          ref: develop
          path: './${{ github.event.repository.name }}-config'
      - name: Update values-sit.yaml
        uses: fjogeleit/yaml-update-action@main
        with:
          repository: ${{ github.repository }}-config
          workDir: '${{ github.event.repository.name }}-config'
          valueFile: 'helm-charts/${{ github.event.repository.name }}/values-sit.yaml'
          propertyPath: 'image.tag'
          value: release-${{ github.sha }}
          branch: develop
          masterBranchName: develop
          targetBranch: develop
          token: ${{ secrets.CONFIG_PAT }}
          message: CD Change by Pipeline
          commitChange: true
          updateFile: true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Retag image as SIT
        run: |
          docker pull canpolatoral/${{ github.event.repository.name }}:release-${{ github.run_number }}
          docker tag canpolatoral/${{ github.event.repository.name }}:release-${{ github.run_number }} canpolatoral/${{ github.event.repository.name }}:sit-latest
          docker push canpolatoral/${{ github.event.repository.name }}:sit-latest

  uat-deployment:
    runs-on: ubuntu-latest
    needs: sit-deployment
    environment: uat
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          repository: ${{ github.repository }}-config
          ref: develop
          path: './${{ github.event.repository.name }}-config'
      - name: Update values-sit.yaml
        uses: fjogeleit/yaml-update-action@main
        with:
          repository: ${{ github.repository }}-config
          workDir: '${{ github.event.repository.name }}-config'
          valueFile: 'helm-charts/${{ github.event.repository.name }}/values-uat.yaml'
          propertyPath: 'image.tag'
          value: release-${{ github.sha }}
          branch: develop
          masterBranchName: develop
          targetBranch: develop
          token: ${{ secrets.CONFIG_PAT }}
          message: CD Change by Pipeline
          commitChange: true
          updateFile: true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Retag image as UAT
        run: |
          docker pull canpolatoral/${{ github.event.repository.name }}:release-${{ github.run_number }}
          docker tag canpolatoral/${{ github.event.repository.name }}:release-${{ github.run_number }} canpolatoral/${{ github.event.repository.name }}:uat-latest
          docker push canpolatoral/${{ github.event.repository.name }}:uat-latest

  cte-deployment:
    runs-on: ubuntu-latest
    needs: uat-deployment
    environment: cte
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          repository: ${{ github.repository }}-config
          ref: develop
          path: './${{ github.event.repository.name }}-config'
      - name: Update values-sit.yaml
        uses: fjogeleit/yaml-update-action@main
        with:
          repository: ${{ github.repository }}-config
          workDir: '${{ github.event.repository.name }}-config'
          valueFile: 'helm-charts/${{ github.event.repository.name }}/values-cte.yaml'
          propertyPath: 'image.tag'
          value: release-${{ github.sha }}
          branch: develop
          masterBranchName: develop
          targetBranch: develop
          token: ${{ secrets.CONFIG_PAT }}
          message: CD Change by Pipeline
          commitChange: true
          updateFile: true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Retag image as UAT
        run: |
          docker pull canpolatoral/${{ github.event.repository.name }}:release-${{ github.run_number }}
          docker tag canpolatoral/${{ github.event.repository.name }}:release-${{ github.run_number }} canpolatoral/${{ github.event.repository.name }}:cte-latest
          docker push canpolatoral/${{ github.event.repository.name }}:cte-latest
      
  stg-deployment:
    runs-on: ubuntu-latest
    needs: cte-deployment
    environment: stg
    steps:
      - name: Validate CR number
        run: |
          cr_number="${{ inputs.cr_number }}"
          if [[ -z "$cr_number" ]]; then
            echo "CR number is required."
            exit 1
          fi
          if [[ ! "$cr_number" =~ ^CR-[0-9]+$ ]]; then
            echo "Invalid CR number format: $cr_number"
            echo "Expected format: CR-12345"
            exit 1
          fi
          echo "CR number validated: $cr_number"
        shell: bash
      - name: Checkout
        uses: actions/checkout@staging
        with:
          repository: ${{ github.repository }}-config
          ref: staging
          path: './${{ github.event.repository.name }}-config'
      - name: Update values-sit.yaml
        uses: fjogeleit/yaml-update-action@main
        with:
          repository: ${{ github.repository }}-config
          workDir: '${{ github.event.repository.name }}-config'
          valueFile: 'helm-charts/${{ github.event.repository.name }}/values-stg.yaml'
          propertyPath: 'image.tag'
          value: release-${{ github.sha }}
          branch: staging
          masterBranchName: staging
          targetBranch: staging
          token: ${{ secrets.CONFIG_PAT }}
          message: CD Change by Pipeline
          commitChange: true
          updateFile: true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Retag image as PT
        run: |
          docker pull canpolatoral/${{ github.event.repository.name }}:release-${{ github.run_number }}
          docker tag canpolatoral/${{ github.event.repository.name }}:release-${{ github.run_number }} canpolatoral/${{ github.event.repository.name }}:stg-latest
          docker push canpolatoral/${{ github.event.repository.name }}:stg-latest
      
      
